version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
    groups:
      minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /packages/api
      - /packages/web
      - /packages/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
    groups:
      minor:
        update-types: [minor, patch]
