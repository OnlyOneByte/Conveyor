version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)
    ignore:
      - dependency-name: "@types/bun"
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /packages/api
      - /packages/web
      - /packages/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix(deps)
    groups:
      images:
        patterns: ["*"]
