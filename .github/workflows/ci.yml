name: Conveyor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Biome lint and import order
        run: bun run lint --reporter=github

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Biome format check
        run: bun run format:check --reporter=github

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Typecheck api, worker, plugins and shared
        run: bunx tsc -p tsconfig.json --noEmit
      - name: Sync SvelteKit
        working-directory: packages/web
        run: bunx svelte-kit sync
      - name: Typecheck web
        working-directory: packages/web
        run: bunx svelte-check --tsconfig ./tsconfig.json

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: bun test with coverage
        run: bun run test:coverage
      - name: Coverage ratchet against the base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}
        run: bun run check:coverage --base "$BASE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/merged.lcov
          if-no-files-found: warn
          retention-days: 14

  no-comments:
    name: no-comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Comment ratchet against the base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}
        run: bun scripts/checks/comments.ts --base "$BASE_REF"

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: false
          build-args: |
            ORCA_ENABLE=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOGIN_URL: https://localhost/auth/login
      WRONG: '{"password":"not-the-password"}'
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway login for this run
        run: |
          password=$(openssl rand -hex 16)
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "::add-mask::$secret"
          echo "CONVEYOR_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "CONVEYOR_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Build the images from source
        run: docker compose build --build-arg ORCA_ENABLE=0
      - name: No checkout or local files in the images
        run: |
          for service in api web worker; do
            docker run --rm --entrypoint sh "conveyor-$service" -c \
              'test ! -e /app/.git && test ! -e /app/.env && test -z "$(find /app -name .git -not -path "*/node_modules/*")"'
            echo "conveyor-$service: no .git, no .env"
          done
      - name: docker compose up
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - name: Only Caddy publishes, on loopback only
        run: |
          docker compose ps --format '{{.Service}} {{.Ports}}' | tee ports.txt
          test "$(awk '/->/ {print $1}' ports.txt | sort -u)" = caddy
          test "$(grep -oE '[^ ,]+->' ports.txt | LC_ALL=C sort -u | tr '\n' ' ')" = "127.0.0.1:443-> 127.0.0.1:80-> "
          caddy_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q caddy)")
          echo "caddy: $caddy_ip"
          test "$caddy_ip" = 172.31.250.2
      - name: Caddy answers /health with 200 on 127.0.0.1
        run: |
          for _ in $(seq 60); do
            code=$(curl -sk -o health.json -w '%{http_code}' --resolve localhost:443:127.0.0.1 https://localhost/health || true)
            if [ "$code" = 200 ] && grep -q '"ok":true' health.json; then exit 0; fi
            sleep 2
          done
          echo "last answer: $code"
          exit 1
      - name: The api keys the real client, not Caddy or a forged header
        run: |
          login() {
            curl -sk -o /dev/null -w '%{http_code}' --resolve localhost:443:127.0.0.1 \
              -H 'content-type: application/json' "$@" -d "$WRONG" "$LOGIN_URL"
          }
          for i in 1 2 3 4 5; do
            test "$(login -H "X-Forwarded-For: 203.0.113.$i")" = 401
          done
          test "$(login)" = 429
          test "$(login -H 'X-Forwarded-For: 198.51.100.7')" = 429
          other=$(docker run --rm --network conveyor_default curlimages/curl:8.11.1 \
            -sk -o /dev/null -w '%{http_code}' --resolve localhost:443:172.31.250.2 \
            -H 'content-type: application/json' -d "$WRONG" "$LOGIN_URL")
          echo "another client on the network: $other"
          test "$other" = 401
          docker compose logs --no-log-prefix api | grep -oE '"remoteAddress":"[^"]*"' | sort | uniq -c | tee seen.txt
          test -s seen.txt
          ! grep -q '"172.31.250.2"' seen.txt
      - name: Every service is still up and never restarted
        run: |
          test "$(docker compose ps --services --status running | sort | tr '\n' ' ')" = "api caddy redis web worker "
          docker inspect -f '{{.Name}} restarts={{.RestartCount}}' $(docker compose ps -q) | tee restarts.txt
          ! grep -v 'restarts=0$' restarts.txt
      - name: Every app container runs unprivileged as uid 10001 and owns secrets.key at 0600
        run: |
          for service in api worker web; do
            docker compose exec -T "$service" cat /proc/1/status > status.txt
            field() { awk -v name="$1:" '$1 == name { $1 = ""; sub(/^ /, ""); print }' status.txt; }
            echo "$service: Uid=[$(field Uid)] Gid=[$(field Gid)] Groups=[$(field Groups)] CapEff=[$(field CapEff)] NoNewPrivs=[$(field NoNewPrivs)]"
            test "$(field Uid)" = "10001 10001 10001 10001"
            test "$(field Gid)" = "10001 10001 10001 10001"
            case "$(field Groups)" in ""|10001|"10001 ") ;; *) exit 1 ;; esac
            test "$(field CapEff)" = 0000000000000000
            test "$(field NoNewPrivs)" = 1
          done
          key=$(docker compose exec -T api stat -c '%u:%g %a' /data/secrets.key)
          echo "secrets.key: $key"
          test "$key" = "10001:10001 600"
      - name: Logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: docker compose down -v
        if: always()
        run: docker compose down -v
