name: Make performance

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      base:
        description: Ref to measure as the baseline
        default: main
      head:
        description: Ref to compare against the baseline
        required: true
      runs:
        description: Lighthouse runs per ref
        default: "10"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: measure Make
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure:make'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base || github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.head || github.event.pull_request.head.sha }}
      RUNS: ${{ inputs.runs || '10' }}
    steps:
      - name: Checkout the measuring scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tools
          sparse-checkout: scripts/perf
          persist-credentials: false

      - name: Checkout the baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BASE_REF }}
          path: base
          persist-credentials: false

      - name: Checkout the compared ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_REF }}
          path: head
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26

      - name: Install and build both
        run: |
          for side in base head; do
            (cd "$side" && bun install --frozen-lockfile)
            (cd "$side/packages/web" && bun x vite build)
          done

      - name: Run Lighthouse on both, alternating
        run: tools/scripts/perf/make-ab.sh base head out

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Make (\`/\`), Lighthouse 12.8.2 mobile, simulated throttling, behind Caddy with compression"
            echo
            bun tools/scripts/perf/summary.ts out "base $(git -C base rev-parse --short HEAD)" "head $(git -C head rev-parse --short HEAD)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: make-perf
          path: out/
          retention-days: 14
