<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Printers mockup · Conveyor</title>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(https://cdn.jsdelivr.net/fontsource/fonts/bricolage-grotesque:vf@5.3.0/latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"DM Mono";src:url(https://cdn.jsdelivr.net/fontsource/fonts/dm-mono@5.3.0/latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--display:"Bricolage Grotesque",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r-chip:16px;--r-control:13px;--r-card:18px;--r-panel:26px}
:root[data-theme=light]{--bg:oklch(.952 .016 85);--paper:oklch(.992 .006 85);--sunk:oklch(.93 .016 85);--ink:oklch(.22 .02 55);--muted:oklch(.45 .02 60);--faint:oklch(.5 .02 65);--line:oklch(.22 .02 55/.13);--line-2:oklch(.22 .02 55/.24);--field-line:oklch(.58 .02 60);--accent:oklch(.68 .19 45);--accent-ink:oklch(.2 .03 45);--focus:oklch(.52 .17 42);--live:oklch(.52 .18 42);--ok:oklch(.48 .13 150);--err:oklch(.5 .2 28);--off:oklch(.5 .01 60);--belt:oklch(.26 .008 60);--lift:0 1px 2px oklch(.22 .02 55/.12);--lift-hi:0 6px 18px oklch(.22 .02 55/.18)}
:root[data-theme=dark]{--bg:oklch(.19 .01 60);--paper:oklch(.25 .012 60);--sunk:oklch(.215 .011 60);--ink:oklch(.95 .012 85);--muted:oklch(.78 .015 80);--faint:oklch(.7 .015 75);--line:oklch(.95 .01 85/.1);--line-2:oklch(.95 .01 85/.2);--field-line:oklch(.6 .015 75);--accent:oklch(.74 .17 50);--accent-ink:oklch(.18 .02 50);--focus:oklch(.74 .17 50);--live:oklch(.77 .16 52);--ok:oklch(.78 .14 150);--err:oklch(.74 .16 28);--off:oklch(.68 .01 60);--belt:oklch(.12 .005 60);--lift:0 1px 2px oklch(0 0 0/.4);--lift-hi:0 6px 18px oklch(0 0 0/.5)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 var(--display);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.shell{max-width:90rem;margin:0 auto;padding:0 var(--s6) var(--s6)}
.top{display:flex;align-items:center;gap:var(--s5);min-height:60px}
.word{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.word i{display:flex;gap:3px}.word i b{width:7px;height:18px;border-radius:3px;background:var(--accent);transform:skewX(-14deg)}.word i b:nth-child(2){opacity:.6}.word i b:nth-child(3){opacity:.3}
.tabs{display:flex;gap:4px;padding:4px;border-radius:15px;background:var(--sunk);border:1px solid var(--line)}
.tabs a{position:relative;display:flex;align-items:center;min-height:38px;padding:0 var(--s4);border-radius:11px;font-weight:600;color:var(--muted);text-decoration:none}
.tabs a[aria-current]{background:var(--paper);color:var(--ink);box-shadow:var(--lift)}
.tabs a[aria-current]::after{content:"";position:absolute;inset:auto var(--s3) 3px;height:3px;border-radius:2px;background:var(--live)}
.sp{flex:1}
.rail{height:40px;margin:var(--s1) 0 var(--s4);border-radius:var(--r-control);border:1.5px dashed var(--line-2);display:flex;align-items:center;justify-content:center;font:500 12px var(--mono);color:var(--faint)}
.head{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;margin:var(--s2) 0 var(--s5)}
.head .t{flex:1;min-width:240px;display:flex;flex-direction:column;gap:var(--s1)}
h1{font-size:36px;line-height:1.05;font-weight:800;letter-spacing:-.04em}
.sub{color:var(--muted)}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:var(--r-control);border:1.5px solid var(--field-line);background:var(--paper);color:var(--ink);font:700 15px var(--display);text-decoration:none;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.quiet{border-color:transparent;background:transparent}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--s4);list-style:none;padding:0}
.card{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) var(--s5) var(--s5);border-radius:var(--r-card);background:var(--paper);border:1px solid var(--line);box-shadow:var(--lift)}
.card.offline{border:1.5px solid var(--err)}
.card header{display:flex;align-items:flex-start;gap:var(--s3)}
.card h2{flex:1;font-size:20px;font-weight:800;letter-spacing:-.02em}
.card .how{font:500 13px var(--mono);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:99px;border:1.5px solid currentColor;font:700 13px var(--display);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ready{color:var(--ok)}.pill.busy{color:var(--live)}.pill.offline{color:var(--err)}.pill.checking{color:var(--muted)}
.pill.checking::before{background:none;border:1.5px solid currentColor}
.now{display:flex;flex-direction:column;gap:2px}
.now a{color:var(--ink);font-weight:700}
.now span{color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--field-line);overflow:hidden}
.bar i{display:block;height:100%;width:64%;background:var(--live)}
.wait{display:flex;flex-direction:column;gap:var(--s1);padding-top:var(--s3);border-top:1.5px dashed var(--line-2)}
.wait b{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wait.stuck b{color:var(--err)}
.wait ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.wait a{color:var(--ink)}
.foot{display:flex;align-items:center;gap:var(--s2);margin-top:auto;color:var(--muted);font-size:13px}
.foot .sp{flex:1}
.empty{max-width:520px;display:flex;flex-direction:column;gap:var(--s3);padding:8vh 0}
.scrim{position:fixed;inset:0;background:color-mix(in oklch,var(--belt) 55%,transparent);display:grid;place-items:center;padding:var(--s4)}
.dialog{width:min(480px,100%);max-height:calc(100vh - 2*var(--s4));overflow:auto;padding:var(--s5);border-radius:var(--r-panel);background:var(--paper);border:1px solid var(--line);box-shadow:var(--lift-hi);display:flex;flex-direction:column;gap:var(--s4)}
.dialog h2{font-size:18px}
.field{display:grid;gap:var(--s1)}
.field label,.field .l{font-weight:650}
.box{display:flex;align-items:center;min-height:44px;padding:0 var(--s3);border:1.5px solid var(--field-line);border-radius:var(--r-control);background:var(--paper);font:inherit;color:var(--ink)}
.box.bad{border-color:var(--err)}
select.box{appearance:auto}
.hint{font-size:13px;color:var(--muted)}
.error{font-size:13px;color:var(--err);font-weight:600}
.check{display:flex;align-items:center;gap:var(--s2);min-height:30px}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.gens{display:flex;flex-direction:column;gap:2px;margin-left:26px}
.saved{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r-control);background:var(--sunk);color:var(--muted)}
.saved span{flex:1}
.da{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.da .sp{flex:1}
@media (max-width:759px){
.shell{padding:0 var(--s4) 110px}
.top{gap:var(--s2);min-height:54px}.word{font-size:20px}
.tabs{position:fixed;z-index:3;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-radius:0;border-width:1px 0 0;border-color:var(--line-2);background:var(--paper);padding:var(--s2) 10px}
.tabs a{justify-content:center;min-height:56px}
.tabs a[aria-current]{background:var(--sunk);box-shadow:none}
.tabs a[aria-current]::after{inset:0 30% auto}
h1{font-size:30px}
.grid{grid-template-columns:1fr}
.head .acts{width:100%}.head .acts .btn.pri{flex:1}
}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <a class="word" href="#printers"><i aria-hidden="true"><b></b><b></b><b></b></i>conveyor</a>
  <nav class="tabs" aria-label="Main"><a href="#printers">Make</a><a href="#printers">Jobs</a><a href="#printers" aria-current="page">Printers</a></nav>
  <span class="sp"></span>
</header>
<div class="rail" aria-hidden="true">Track rail, 40 px</div>
<main id="main" tabindex="-1"></main>
</div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
const plus = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const head = '<div class="head"><div class="t"><h1 id="title">Printers</h1><p class="sub">3 printers · 3 jobs waiting</p></div><div class="acts"><button class="btn pri" type="button">' + plus + 'Add printer</button><button class="btn" type="button" aria-haspopup="menu">More</button></div></div>';
const waiting = (jobs, stuck) => jobs.length
  ? `<div class="wait${stuck ? " stuck" : ""}"><b>${jobs.length} waiting${stuck ? " · can't start until it's back" : ""}</b><ol>${jobs.map((j) => `<li><a href="#printers">${j}</a></li>`).join("")}</ol></div>`
  : '<div class="wait"><b>Nothing waiting</b></div>';
const card = (tone, name, how, pill, now, wait, foot) => `<li class="card ${tone}"><header><div><h2>${name}</h2><p class="how">${how}</p></div><span class="pill ${tone}">${pill}</span></header>${now}${wait}<div class="foot">${foot}<span class="sp"></span><button class="btn" type="button" aria-label="Edit ${name}">Edit</button></div></li>`;
const cards = [
  card("busy", "Voron 2.4", "Moonraker · 192.168.1.50", "Busy", '<div class="now"><a href="#printers">Gridfinity Bin 2×3 · 6u</a><span>Printing · 64% · 41 min left</span></div><div class="bar" role="progressbar" aria-label="Voron 2.4 print progress" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><i></i></div>', waiting(["Gridfinity Bin 1×1 · 3u"]), "API key saved"),
  card("offline", "Elegoo Centauri", "Elegoo · 192.168.1.61", "Offline", '<div class="now"><span>Didn\'t answer within 2 seconds. Last answered 3h ago.</span></div>', waiting(["Cable clip", "Gridfinity Bin 2×2 · 3u"], true), "Prints Gridfinity only"),
  card("ready", "Garage Klipper", "Moonraker · garage.local:7125", "Ready", '<div class="now"><span>Answered in 12 ms</span></div>', waiting([]), "Prints anything"),
];
const page = () => `${head}<ul class="grid" aria-label="Printers">${cards.join("")}</ul>`;
const field = (label, value, { hint = "", error = "", type = "text" } = {}) => `<div class="field"><label>${label}</label><input class="box${error ? " bad" : ""}" type="${type}" value="${value}" aria-invalid="${!!error}">${hint ? `<p class="hint">${hint}</p>` : ""}${error ? `<p class="error">${error}</p>` : ""}</div>`;
const transport = '<div class="field"><label>Connection</label><select class="box"><option>Moonraker (Klipper)</option><option>Elegoo (SDCP)</option></select></div>';
const gens = (on) => `<label class="check"><input type="checkbox"${on ? " checked" : ""}>Only some generators can print here</label>${on ? '<div class="gens"><label class="check"><input type="checkbox" checked>Gridfinity Bin</label><label class="check"><input type="checkbox">Passthrough STL</label></div>' : ""}`;
const dialog = (title, body, acts) => `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${title}</h2>${body}<div class="da">${acts}</div></div></div>`;
const addActs = '<span class="sp"></span><button class="btn quiet" type="button">Cancel</button><button class="btn pri" type="button">Add printer</button>';
const S = {
  printers: page,
  add: () => page() + dialog("Add printer", field("Name", "") + field("ID", "", { hint: "Used in links and the API. It can't change later." }) + transport + field("Address", "", { hint: "IP address or host name. Add :port if it isn't 80." }) + field("API key", "", { type: "password", hint: "Optional. Only needed if Moonraker asks for one." }) + gens(false), addActs),
  invalid: () => page() + dialog("Add printer", field("Name", "", { error: "Give the printer a name." }) + field("ID", "voron-2-4", { error: "Another printer already uses voron-2-4." }) + transport + field("Address", "", { error: "Enter the printer's address." }) + field("API key", "", { type: "password" }) + gens(false), addActs),
  edit: () => page() + dialog("Edit Garage Klipper", field("Name", "Garage Klipper") + transport + field("Address", "garage.local:7125") + field("API key", "", { type: "password", hint: "Leave blank to keep the saved one." }) + '<div class="saved"><span>Secrets are saved for this printer.</span><button class="btn" type="button">Clear saved secrets</button></div>' + gens(false),
    '<button class="btn danger" type="button">Delete printer</button><span class="sp"></span><button class="btn quiet" type="button">Cancel</button><button class="btn pri" type="button">Save changes</button>'),
  delete: () => page() + dialog("Delete Elegoo Centauri?", "<p>Its 2 waiting jobs have to finish or be canceled first. Printed jobs keep their history.</p>", '<span class="sp"></span><button class="btn quiet" type="button">Keep it</button><button class="btn danger" type="button">Delete printer</button>'),
  empty: () => `<div class="empty"><h1 id="title">Printers</h1><p class="sub">No printers yet. Add one and Make can send it jobs.</p><div class="acts"><button class="btn pri" type="button">${plus}Add printer</button></div></div>`,
};
function show() {
  const state = location.hash.slice(1) || "printers";
  document.getElementById("main").innerHTML = (S[state] ?? S.printers)();
  document.title = `${document.getElementById("title").textContent} · Conveyor`;
}
addEventListener("hashchange", show);
show();
</script>
</body>
</html>
