name: conveyor

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy-init:
    image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: "no"
    logging: *logging
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    network_mode: none
    entrypoint:
      - sh
      - -eo
      - pipefail
      - -c
      - |
        stale() { find /data /config \( ! -user 10002 -o ! -group 10002 \) "$$@"; }
        n=$$(stale | wc -l)
        stale -exec chown -h 10002:10002 {} +
        echo "caddy-init: $$n paths handed to 10002:10002"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  caddy:
    image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    logging: *logging
    user: "10002:10002"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "${CONVEYOR_BIND:-127.0.0.1}:80:80"
      - "${CONVEYOR_BIND:-127.0.0.1}:443:443"
    environment:
      - CONVEYOR_DOMAIN=${CONVEYOR_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.31.250.2
    depends_on:
      caddy-init: { condition: service_completed_successfully }
      web: { condition: service_healthy }
      api: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: packages/web/Dockerfile }
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: packages/api/Dockerfile }
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    environment:
      - REDIS_URL=redis://redis:6379
      - CONVEYOR_QUEUE=${CONVEYOR_QUEUE:-redis}
      - CONVEYOR_QUEUE_UNSTABLE=${CONVEYOR_QUEUE_UNSTABLE:-}
      - PORT=3000
      - CONVEYOR_HOST=0.0.0.0
      - DATA_DIR=/data
      - CONVEYOR_PROFILES_ROOT=/profiles
      - CONVEYOR_AUTH=${CONVEYOR_AUTH:-}
      - CONVEYOR_PASSWORD=${CONVEYOR_PASSWORD:-}
      - CONVEYOR_AUTH_SECRET=${CONVEYOR_AUTH_SECRET:-}
      - CONVEYOR_SECRETS_KEY=${CONVEYOR_SECRETS_KEY:-}
      - CONVEYOR_TRUSTED_PROXIES=172.31.250.2
      - CONVEYOR_DOMAIN=${CONVEYOR_DOMAIN:-localhost}
      - CONVEYOR_ALLOWED_HOSTS=${CONVEYOR_ALLOWED_HOSTS:-}
      - CONVEYOR_UPLOADS_MAX_BYTES=${CONVEYOR_UPLOADS_MAX_BYTES:-}
      - PRINTER_ADDRESS_ALLOW=${PRINTER_ADDRESS_ALLOW:-}
      - CONVEYOR_RETENTION_DAYS=${CONVEYOR_RETENTION_DAYS:-}
    volumes:
      - ./data:/data
      - ./profiles:/profiles:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: packages/worker/Dockerfile }
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    tmpfs: ["/tmp:mode=1777"]
    stop_grace_period: 60s
    environment:
      - REDIS_URL=redis://redis:6379
      - CONVEYOR_QUEUE=${CONVEYOR_QUEUE:-redis}
      - CONVEYOR_QUEUE_UNSTABLE=${CONVEYOR_QUEUE_UNSTABLE:-}
      - DB_PATH=/data/conveyor.db
      - CONVEYOR_SECRETS_KEY=${CONVEYOR_SECRETS_KEY:-}
      - CONVEYOR_UPLOAD_TIMEOUT_MS=${CONVEYOR_UPLOAD_TIMEOUT_MS:-}
      - CONVEYOR_PRINTER_KEEP_FILES=${CONVEYOR_PRINTER_KEEP_FILES:-}
      - PRINTER_ADDRESS_ALLOW=${PRINTER_ADDRESS_ALLOW:-}
      - MOONRAKER_START_TIMEOUT_MS=${MOONRAKER_START_TIMEOUT_MS:-}
      - ELEGOO_START_TIMEOUT_MS=${ELEGOO_START_TIMEOUT_MS:-}
      - MOONRAKER_STATUS_TIMEOUT_MS=${MOONRAKER_STATUS_TIMEOUT_MS:-}
      - MOONRAKER_STATUS_FAILURES=${MOONRAKER_STATUS_FAILURES:-}
      - CONVEYOR_RETENTION_DAYS=${CONVEYOR_RETENTION_DAYS:-}
    volumes:
      - ./data:/data
      - ./profiles:/profiles:ro
      - ./scad:/scad:ro
    depends_on:
      redis: { condition: service_healthy }

  redis:
    image: redis:8-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    restart: unless-stopped
    logging: *logging
    user: "999:1000"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    tmpfs: ["/usr/local/lib/redis/modules:ro"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25
