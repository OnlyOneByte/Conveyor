name: conveyor

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "${CONVEYOR_BIND:-127.0.0.1}:80:80"
      - "${CONVEYOR_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.31.250.2
    depends_on: [web, api]

  web:
    build: { context: ., dockerfile: packages/web/Dockerfile }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://localhost}
    depends_on: [api]

  api:
    build: { context: ., dockerfile: packages/api/Dockerfile }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    environment:
      - REDIS_URL=redis://redis:6379
      - CONVEYOR_QUEUE=${CONVEYOR_QUEUE:-redis}
      - CONVEYOR_QUEUE_UNSTABLE=${CONVEYOR_QUEUE_UNSTABLE:-}
      - PORT=3000
      - CONVEYOR_HOST=0.0.0.0
      - DATA_DIR=/data
      - CONVEYOR_PROFILES_ROOT=/profiles
      - CONVEYOR_AUTH=${CONVEYOR_AUTH:-}
      - CONVEYOR_PASSWORD=${CONVEYOR_PASSWORD:-}
      - CONVEYOR_AUTH_SECRET=${CONVEYOR_AUTH_SECRET:-}
      - CONVEYOR_SECRETS_KEY=${CONVEYOR_SECRETS_KEY:-}
      - CONVEYOR_TRUSTED_PROXIES=172.31.250.2
    volumes:
      - ./data:/data
      - ./profiles:/profiles:ro
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: packages/worker/Dockerfile }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    tmpfs: ["/tmp:mode=1777"]
    stop_grace_period: 60s
    environment:
      - REDIS_URL=redis://redis:6379
      - CONVEYOR_QUEUE=${CONVEYOR_QUEUE:-redis}
      - CONVEYOR_QUEUE_UNSTABLE=${CONVEYOR_QUEUE_UNSTABLE:-}
      - DB_PATH=/data/conveyor.db
      - CONVEYOR_SECRETS_KEY=${CONVEYOR_SECRETS_KEY:-}
    volumes:
      - ./data:/data
      - ./profiles:/profiles:ro
      - ./scad:/scad:ro
    depends_on:
      redis: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:1000"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: [ALL]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25
