name: conveyor

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${CONVEYOR_BIND:-127.0.0.1}:80:80"
      - "${CONVEYOR_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    build: { context: ., dockerfile: packages/web/Dockerfile }
    restart: unless-stopped
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://localhost}
    depends_on: [api]

  api:
    build: { context: ., dockerfile: packages/api/Dockerfile }
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - CONVEYOR_HOST=0.0.0.0
      - DATA_DIR=/data
      - CONVEYOR_PROFILES_ROOT=/profiles
      - CONVEYOR_AUTH=${CONVEYOR_AUTH:-}
      - CONVEYOR_PASSWORD=${CONVEYOR_PASSWORD:-}
      - CONVEYOR_AUTH_SECRET=${CONVEYOR_AUTH_SECRET:-}
    volumes:
      - ./data:/data
      - ./profiles:/profiles:ro
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: packages/worker/Dockerfile }
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/data/conveyor.db
    volumes:
      - ./data:/data
      - ./profiles:/profiles:ro
      - ./scad:/scad:ro
    depends_on:
      redis: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis_data:
